# links.leadershipnowproject.com: the dashboard, behind Cloudflare Access.
# Mounted into the frontend container at /etc/nginx/site.d/ and included at the
# top of the stock server block.
#
# The dashboard calls the API at https://links.leadershipnowproject.com/api
# (VITE_API_URL), so every call is same-origin and carries the Access cookie;
# Cloudflare adds Cf-Access-Jwt-Assertion, which /auth/cf-access reads.

# Accounts are created by Cloudflare Access sign-in, not by the form.
location = /api/auth/register {
    return 403;
}
location = /register {
    return 302 https://$host/login;
}

# Live click stream: Server-Sent Events must not be buffered.
location = /api/sse {
    rewrite ^/api(/.*)$ $1 break;
    proxy_pass $backend_url;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    # The stream authenticates with ?token=; keep it out of error logs.
    error_log /var/log/nginx/error.log crit;
}

location ^~ /api/ {
    rewrite ^/api(/.*)$ $1 break;
    proxy_pass $backend_url;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Strict-Transport-Security;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
    proxy_connect_timeout 10s;
    proxy_read_timeout 120s;
    # CSV import/export and bulk create.
    client_max_body_size 10m;
}
