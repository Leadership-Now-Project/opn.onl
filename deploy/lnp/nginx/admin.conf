# links.leadershipnowproject.com: the dashboard. Staff sign in on its login
# page with their Leadership Now Project Google account (/api/auth/google,
# backend/src/handlers/google_auth.rs); nothing else in front of it checks who
# they are. Mounted into the frontend container at /etc/nginx/site.d/ and
# included at the top of the stock server block.
#
# The dashboard calls the API at https://links.leadershipnowproject.com/api
# (VITE_API_URL), so every call is same-origin.
#
# This file belongs to the dashboard image that has the Google button. Put it
# on the server in the same step as that image: an older image signs in through
# /api/auth/cf-access, which is refused below.

# Staff come here to work, not to read opn.onl's marketing page. /dashboard
# sends anyone without a session to /login.
location = / {
    return 302 https://$host/dashboard;
}

# Google is the only way in on this host. Every other route that hands out a
# session, or leads to one, is refused before it reaches the backend:
#   register                   accounts are created by Google sign-in
#   login                      password sign-in
#   forgot-/reset-password     a mailed link that sets a password
#   cf-access                  Cloudflare Access sign-in; only the Claude
#                              connector uses it, and it calls the backend
#                              directly, not through this host
#   passkey/...                passkey sign-in and enrolment
# Still passing: /api/auth/google, /api/auth/settings (the login page reads the
# Google client id from it), /api/auth/me and the signed-in account routes.
location = /api/auth/register {
    return 403;
}
location = /api/auth/login {
    return 403;
}
location = /api/auth/forgot-password {
    return 403;
}
location = /api/auth/reset-password {
    return 403;
}
location = /api/auth/cf-access {
    return 403;
}
location ^~ /api/auth/passkey/ {
    return 403;
}
# The pages for those routes have nothing to offer here.
location = /register {
    return 302 https://$host/login;
}
location = /forgot-password {
    return 302 https://$host/login;
}
location = /reset-password {
    return 302 https://$host/login;
}

# Live click stream: Server-Sent Events must not be buffered.
location = /api/sse {
    rewrite ^/api(/.*)$ $1 break;
    proxy_pass $backend_url;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    # The stream authenticates with ?token=; keep it out of error logs.
    error_log /var/log/nginx/error.log crit;
}

location ^~ /api/ {
    rewrite ^/api(/.*)$ $1 break;
    proxy_pass $backend_url;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Strict-Transport-Security;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
    proxy_connect_timeout 10s;
    proxy_read_timeout 120s;
    # CSV import/export and bulk create.
    client_max_body_size 10m;
}
