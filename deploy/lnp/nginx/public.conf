# ldr.now: public short links only. Mounted into the frontend container at
# /etc/nginx/site.d/ and included at the top of the stock server block, so the
# regex locations here win over the stock ones.
#
# Served on this host: /<code> redirects, /<code>/verify, /<code>/preview,
# /password/<code>, /r/<code>, the Secure View viewer (/v/<code>, with its two
# calls /<code>/view and /<code>/view/file) and static assets (all stock
# locations).
# Refused here: the dashboard and every API route a visitor does not need.

# The bare short-link domain goes to LNP's website (Jay, 29 Oct 2026).
# 302 rather than 301, so browsers don't cache it if this changes later.
location = / {
    return 302 https://www.leadershipnowproject.org/;
}

# Backend API routes that are a single word look like short codes to the stock
# locations, so they would reach the backend from here. They all need a token,
# but nothing on this host needs them: refuse them outright. (The /api/ form is
# refused inside the /api/ block below, which regexes out here cannot reach.)
location ~ ^/(links|tags|folders|orgs|analytics|ws|sse|contact|auth|admin|swagger-ui|api-docs)(/.*)?$ {
    return 404;
}

# File sharing's API (start an upload, complete it, storage use) belongs to the
# dashboard host. On this host a file is reached only by opening its short
# link, like any other. Named exactly, not as a `files` prefix: `/files` alone
# may be somebody's short code.
location ~ ^/files/(uploads|usage)(/.*)?$ {
    return 404;
}

# Dashboard and account pages live on the dashboard host (Google sign-in).
location ~ ^/(dashboard|overview|login|register|settings|organizations|analytics|admin|verify-email|forgot-password|reset-password)(/.*)?$ {
    return 302 https://links.leadershipnowproject.com$request_uri;
}

# The public pages call the API at https://ldr.now/api (VITE_API_URL). Only the
# routes a visitor needs pass (a short link, its password check, its preview,
# and the Secure View viewer's two calls); everything else under /api is 404.
location ^~ /api/ {
    location ~ ^/api/(links|tags|folders|orgs|analytics|ws|sse|contact|auth|admin|swagger-ui|api-docs)(/.*)?$ {
        return 404;
    }
    # The file sharing API. It would fall through to the 404 at the end of
    # this block anyway; this says so on purpose.
    location ~ ^/api/files/(uploads|usage)(/.*)?$ {
        return 404;
    }
    # Secure View: the file, streamed by the backend to the viewer. The view
    # token is in a request header, so no log line can hold it. Large files:
    # passed straight through (nothing spooled to this container's disk) and
    # given time to arrive.
    location ~ "^/api/[A-Za-z0-9_-]{1,255}/view/file$" {
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass $backend_url;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Strict-Transport-Security;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        error_log /var/log/nginx/error.log crit;
    }
    # /view is the Secure View viewer giving the backend an email (POST).
    location ~ "^/api/[A-Za-z0-9_-]{1,255}(/verify|/preview|/view)?$" {
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass $backend_url;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Strict-Transport-Security;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        # A continue URL carries ?unlock=<token>; keep it out of error logs.
        error_log /var/log/nginx/error.log crit;
    }
    return 404;
}
