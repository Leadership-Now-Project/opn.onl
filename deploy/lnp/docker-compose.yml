# opn.onl for Leadership Now Project.
#
#   ldr.now                          -> frontend-public (127.0.0.1:3101), public
#   links.leadershipnowproject.com   -> frontend-admin  (127.0.0.1:3102), Cloudflare Access
#
# Both frontends proxy their own /api/ to the one backend (see nginx/), so every
# browser call is same-origin. Images are built by .github/workflows/lnp-images.yml
# and only pulled here; nothing is compiled on the server.
#
#   cp .env.example .env   # then fill in the secrets
#   docker compose pull && docker compose up -d

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: opn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: opn_onl
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opn -d opn_onl"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  backend:
    image: ghcr.io/leadership-now-project/opn-backend:${OPN_TAG:?set OPN_TAG in .env}
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      POSTGRES_USER: opn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: opn_onl
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (openssl rand -base64 64)}
      HOST: 0.0.0.0
      PORT: "3000"
      # Short links are minted on FRONTEND_URL.
      FRONTEND_URL: https://ldr.now
      BASE_URL: https://links.leadershipnowproject.com/api
      FORCE_HTTPS: "true"
      TRUST_PROXY_HEADERS: "true"
      REAL_IP_HEADER: cf-connecting-ip
      RUST_LOG: info,tower_http=info
      LOG_DIR: /app/logs
      LOG_MAX_FILES: "14"
      REDIS_URL: redis://redis:6379
      # Sign-in through Cloudflare Access (backend/src/handlers/cf_access.rs).
      CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN:?set CF_ACCESS_TEAM_DOMAIN in .env}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD:?set CF_ACCESS_AUD in .env}
      CF_ACCESS_ALLOWED_EMAIL_DOMAINS: leadershipnowproject.com,leadershipnowproject.org
      # No SMTP: Access-created accounts are verified, and nobody signs in by
      # password, so no mail is needed.
      REQUIRE_EMAIL_VERIFICATION: "false"
      LINK_EXPIRY_REMINDERS: "false"
      ALLOW_ANONYMOUS_LINKS: "false"
      # Passkeys bind to FRONTEND_URL (ldr.now), where nobody signs in.
      ENABLE_PASSKEYS: "false"
      # Public link-in-bio pages are off until someone asks for them.
      ENABLE_LINK_IN_BIO: "false"
      ENABLE_ACCOUNT_DELETION: "false"
      ENABLE_API_KEYS: "true"
      ENABLE_CUSTOM_ALIASES: "true"
      MIN_ALIAS_LENGTH: "4"
      MAX_ALIAS_LENGTH: "50"
      MAXMIND_ACCOUNT_ID: ${MAXMIND_ACCOUNT_ID:-}
      MAXMIND_LICENSE_KEY: ${MAXMIND_LICENSE_KEY:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-us-east-2}
    volumes:
      - backend_logs:/app/logs
      - backend_geoip:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging: *default-logging

  frontend-public:
    image: ghcr.io/leadership-now-project/opn-frontend-public:${OPN_TAG}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3101:80"
    volumes:
      - ./nginx/public.conf:/etc/nginx/site.d/lnp.conf:ro
    logging: *default-logging

  frontend-admin:
    image: ghcr.io/leadership-now-project/opn-frontend-admin:${OPN_TAG}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3102:80"
    volumes:
      - ./nginx/admin.conf:/etc/nginx/site.d/lnp.conf:ro
    logging: *default-logging

volumes:
  db_data:
  redis_data:
  backend_logs:
  backend_geoip:
