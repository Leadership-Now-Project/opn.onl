# opn.onl for Leadership Now Project.
#
#   ldr.now                          -> frontend-public (127.0.0.1:3101), public
#   links.leadershipnowproject.com   -> frontend-admin  (127.0.0.1:3102), Google sign-in in the app
#   links-mcp.leadershipnowproject.com -> mcp           (127.0.0.1:3104), its own OAuth sign-in, then Google
#
# Both frontends proxy their own /api/ to the one backend (see nginx/), so every
# browser call is same-origin. Images are built by .github/workflows/lnp-images.yml
# and only pulled here; nothing is compiled on the server.
#
#   cp .env.example .env   # then fill in the secrets
#   docker compose pull && docker compose up -d

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: opn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: opn_onl
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opn -d opn_onl"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  backend:
    image: ghcr.io/leadership-now-project/opn-backend:${OPN_TAG:?set OPN_TAG in .env}
    restart: unless-stopped
    # A ceiling, so a runaway request ends this container (which restarts)
    # rather than the host choosing something to kill, the database included.
    # The known case is Secure View's protected copy of a hostile PDF: the PDF
    # library's memory while it reads such a file is not bounded (README,
    # "The protected copy"). Normal use is tens of megabytes.
    mem_limit: 1g
    memswap_limit: 1g
    stop_grace_period: 30s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      POSTGRES_USER: opn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: opn_onl
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (openssl rand -base64 64)}
      HOST: 0.0.0.0
      PORT: "3000"
      # Short links are minted on FRONTEND_URL.
      FRONTEND_URL: https://ldr.now
      BASE_URL: https://links.leadershipnowproject.com/api
      FORCE_HTTPS: "true"
      TRUST_PROXY_HEADERS: "true"
      REAL_IP_HEADER: cf-connecting-ip
      RUST_LOG: info,tower_http=info
      LOG_DIR: /app/logs
      LOG_MAX_FILES: "14"
      REDIS_URL: redis://redis:6379
      # Dashboard sign-in: Google accounts from these domains only
      # (backend/src/handlers/google_auth.rs). Off, and the login page shows no
      # Google button, until the client id and secret are both set.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_ALLOWED_DOMAINS: ${GOOGLE_ALLOWED_DOMAINS:-leadershipnowproject.com,leadershipnowproject.org}
      GOOGLE_REQUIRE_HD: ${GOOGLE_REQUIRE_HD:-}
      # The shared organization every staff account joins at sign-in
      # (backend/src/handlers/default_org.rs). Off while name or slug is blank.
      DEFAULT_ORG_NAME: ${DEFAULT_ORG_NAME:-}
      DEFAULT_ORG_SLUG: ${DEFAULT_ORG_SLUG:-}
      DEFAULT_ORG_ADMINS: ${DEFAULT_ORG_ADMINS:-}
      # The Claude connector's sign-in (backend/src/handlers/connector_auth.rs):
      # on with Google sign-in above. The connector signs its session renewals
      # with this secret; the mcp service below gets the same value.
      # /auth/cf-access (Cloudflare Access sign-in) is off: its settings are
      # no longer passed, and the endpoint answers 404 without them.
      CONNECTOR_SIGNIN_SECRET: ${CONNECTOR_SIGNIN_SECRET:?set CONNECTOR_SIGNIN_SECRET in .env (openssl rand -base64 48)}
      # No SMTP: accounts created by Google sign-in are verified, and
      # nobody signs in by password, so no mail is needed.
      REQUIRE_EMAIL_VERIFICATION: "false"
      LINK_EXPIRY_REMINDERS: "false"
      ALLOW_ANONYMOUS_LINKS: "false"
      # Passkeys bind to FRONTEND_URL (ldr.now), where nobody signs in.
      ENABLE_PASSKEYS: "false"
      # Public link-in-bio pages are off until someone asks for them.
      ENABLE_LINK_IN_BIO: "false"
      ENABLE_ACCOUNT_DELETION: "false"
      ENABLE_API_KEYS: ${ENABLE_API_KEYS:-false}
      ENABLE_CUSTOM_ALIASES: "true"
      MIN_ALIAS_LENGTH: "4"
      MAX_ALIAS_LENGTH: "50"
      MAXMIND_ACCOUNT_ID: ${MAXMIND_ACCOUNT_ID:-}
      MAXMIND_LICENSE_KEY: ${MAXMIND_LICENSE_KEY:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-us-east-2}
      # File sharing (README, "File sharing"): a private bucket for uploaded
      # files, separate from the backup bucket. Off while the bucket is blank.
      FILES_S3_BUCKET: ${FILES_S3_BUCKET:-}
      FILES_S3_REGION: ${FILES_S3_REGION:-}
      FILES_S3_ENDPOINT: ${FILES_S3_ENDPOINT:-}
      FILES_S3_ACCESS_KEY: ${FILES_S3_ACCESS_KEY:-}
      FILES_S3_SECRET_KEY: ${FILES_S3_SECRET_KEY:-}
      FILES_MAX_BYTES: ${FILES_MAX_BYTES:-}
      FILES_UPLOAD_URL_TTL_SECS: ${FILES_UPLOAD_URL_TTL_SECS:-}
      FILES_DOWNLOAD_URL_TTL_SECS: ${FILES_DOWNLOAD_URL_TTL_SECS:-}
      SECURE_VIEW_PROTECT_MAX_BYTES: ${SECURE_VIEW_PROTECT_MAX_BYTES:-}
      SECURE_VIEW_PROTECT_BUDGET_BYTES: ${SECURE_VIEW_PROTECT_BUDGET_BYTES:-}
      # "Google Drive Files" on the Files tab (README, "Google Drive picker").
      # Both are public values the dashboard hands to Google's file picker.
      # Off while either is blank.
      GOOGLE_PICKER_API_KEY: ${GOOGLE_PICKER_API_KEY:-}
      GOOGLE_PICKER_APP_ID: ${GOOGLE_PICKER_APP_ID:-}
      # Media links (README, "Media pages"): ask YouTube or Vimeo whether a
      # video can be embedded before a link is made for it. On while blank.
      MEDIA_EMBED_CHECK: ${MEDIA_EMBED_CHECK:-}
    volumes:
      - backend_logs:/app/logs
      - backend_geoip:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging: *default-logging

  frontend-public:
    image: ghcr.io/leadership-now-project/opn-frontend-public:${OPN_TAG}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3101:80"
    volumes:
      - ./nginx/public.conf:/etc/nginx/site.d/lnp.conf:ro
    logging: *default-logging

  frontend-admin:
    # OPN_ADMIN_TAG pins the dashboard while a newer one is previewed.
    image: ghcr.io/leadership-now-project/opn-frontend-admin:${OPN_ADMIN_TAG:-${OPN_TAG}}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3102:80"
    volumes:
      - ./nginx/admin.conf:/etc/nginx/site.d/lnp.conf:ro
    logging: *default-logging

  # A newer dashboard beside the live one, for whoever sets the preview cookie
  # (the edge proxy routes /__preview/on and /__preview/off). Started only with
  # `docker compose --profile preview up -d`; OPN_PREVIEW_TAG picks the image.
  frontend-admin-preview:
    image: ghcr.io/leadership-now-project/opn-frontend-admin:${OPN_PREVIEW_TAG:-${OPN_TAG}}
    profiles: ["preview"]
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3103:80"
    volumes:
      - ./nginx/admin.conf:/etc/nginx/site.d/lnp.conf:ro
    logging: *default-logging

  # Remote MCP server for Claude connectors (links-mcp.leadershipnowproject.com).
  # It is its own OAuth 2.1 authorization server: Claude registers with it,
  # the person signs in with Google (the dashboard's client), and the backend
  # checks the Google ID token and names the account (/auth/connector/google)
  # and renews its session (/auth/connector/session). README, "Claude
  # connector"; mcp/oauth.mjs.
  mcp:
    image: ghcr.io/leadership-now-project/opn-mcp-remote:${OPN_MCP_TAG:-${OPN_TAG}}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:3000
      # The address it calls itself in what it hands Claude; never taken from
      # a request.
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-https://links-mcp.leadershipnowproject.com}
      # Seals client ids and tokens. The server does not start without it.
      MCP_OAUTH_SECRET: ${MCP_OAUTH_SECRET:?set MCP_OAUTH_SECRET in .env (openssl rand -base64 48)}
      # The same value the backend has; a different one from MCP_OAUTH_SECRET.
      CONNECTOR_SIGNIN_SECRET: ${CONNECTOR_SIGNIN_SECRET}
      # Hours from the Google sign-in until a person must connect again
      # (default 168), and where a sign-in may return to (default Claude's two
      # callback addresses).
      MCP_SESSION_HOURS: ${MCP_SESSION_HOURS:-}
      MCP_ALLOWED_REDIRECT_URIS: ${MCP_ALLOWED_REDIRECT_URIS:-}
      # The dashboard's Google client. Its redirect URIs must include
      # <MCP_PUBLIC_URL>/oauth/google/callback.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?set GOOGLE_CLIENT_ID in .env}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?set GOOGLE_CLIENT_SECRET in .env}
    ports:
      - "127.0.0.1:3104:3000"
    logging: *default-logging

volumes:
  db_data:
  redis_data:
  backend_logs:
  backend_geoip:
