name: LNP images

# Builds the three images deploy/lnp/docker-compose.yml runs, for linux/amd64,
# and pushes them to ghcr.io/leadership-now-project. Run it by pushing a tag
# `lnp-<upstream version>-<n>` (e.g. lnp-1.9.0-1) once CI has passed on the
# commit, or by hand from the Actions tab. The tag becomes the image tag
# (OPN_TAG in the server's .env).

on:
  push:
    tags: ['lnp-*']
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish
        required: true

concurrency:
  group: lnp-images-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/leadership-now-project
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: opn-backend
            context: backend
            build_args: ""
          - image: opn-frontend-public
            context: frontend
            build_args: |
              VITE_API_URL=https://ldr.now/api
              VITE_FRONTEND_URL=https://ldr.now
          - image: opn-frontend-admin
            context: frontend
            build_args: |
              VITE_API_URL=https://links.leadershipnowproject.com/api
              VITE_FRONTEND_URL=https://ldr.now
              VITE_CF_ACCESS=true
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          build-args: ${{ matrix.build_args }}
          tags: ${{ env.REGISTRY }}/${{ matrix.image }}:${{ env.TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
